<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voxel Game</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
      }
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        pointer-events: none;
        mix-blend-mode: difference;
      }
      #hud {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        pointer-events: none;
      }
      .slot {
        width: 40px;
        height: 40px;
        border: 2px solid rgba(255, 255, 255, 0.6);
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 11px;
        border-radius: 4px;
      }
      .slot.active {
        border-color: #fff;
        background: rgba(255, 255, 255, 0.2);
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 20, 0.92);
        color: #fff;
        text-align: center;
        gap: 12px;
        cursor: pointer;
        z-index: 10;
      }
      #overlay h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 1px;
      }
      #overlay p {
        margin: 0;
        opacity: 0.8;
        max-width: 480px;
        line-height: 1.5;
        font-size: 14px;
      }
      #overlay.hidden {
        display: none;
      }
      #stats {
        position: absolute;
        top: 8px;
        left: 8px;
        color: #fff;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.35);
        padding: 6px 10px;
        border-radius: 4px;
        pointer-events: none;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="overlay">
        <h1>Voxel Game</h1>
        <p>
          Click to play. WASD to move, Space to jump, Shift to sprint.<br />
          Left click to break a block, right click to place one.<br />
          1-5 to pick a block, Esc to release the mouse.
        </p>
      </div>
      <div id="crosshair"></div>
      <div id="stats"></div>
      <div id="hud"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
